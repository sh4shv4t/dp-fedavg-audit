<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DP-FedAvg Audit: does private federated learning keep its promise?">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- federated clients feeding a server, with noise -->
  <g transform="translate(860,150)">
    <g stroke="#475569" stroke-width="1.5">
      <line x1="0" y1="0" x2="-150" y2="-90"/><line x1="0" y1="0" x2="-170" y2="0"/>
      <line x1="0" y1="0" x2="-150" y2="90"/><line x1="0" y1="0" x2="150" y2="-90"/>
      <line x1="0" y1="0" x2="170" y2="0"/><line x1="0" y1="0" x2="150" y2="90"/>
    </g>
    <g fill="#38bdf8">
      <circle cx="-150" cy="-90" r="12"/><circle cx="-170" cy="0" r="12"/><circle cx="-150" cy="90" r="12"/>
      <circle cx="150" cy="-90" r="12"/><circle cx="170" cy="0" r="12"/><circle cx="150" cy="90" r="12"/>
    </g>
    <g fill="#f97316" opacity="0.85">
      <circle cx="-62" cy="-30" r="3"/><circle cx="-80" cy="8" r="2.5"/><circle cx="-58" cy="42" r="3"/>
      <circle cx="66" cy="-44" r="2.5"/><circle cx="84" cy="-6" r="3"/><circle cx="60" cy="36" r="2.5"/>
      <circle cx="-30" cy="-58" r="2"/><circle cx="34" cy="60" r="2"/><circle cx="-102" cy="-50" r="2"/>
      <circle cx="108" cy="52" r="2"/>
    </g>
    <circle r="40" fill="#0f172a" stroke="url(#accent)" stroke-width="4"/>
    <text y="8" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="24" font-weight="700" fill="#f8fafc">ε</text>
  </g>

  <text x="60" y="118" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="58" font-weight="800" fill="#f8fafc">DP-FedAvg Audit</text>
  <rect x="62" y="136" width="250" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#cbd5e1">Does private federated learning keep its promise?</text>
  <text x="60" y="226" font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#94a3b8">membership inference · privacy auditing · CIFAR-10 · 500 clients</text>
</svg>
